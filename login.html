<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusSphere - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body style="display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh;">

  <main class="container" style="max-width: 520px; width: 100%; margin: 0 auto;">
    <header class="welcome-header" style="text-align: center;">
      <h1 style="font-size: 2rem; font-weight: 800; color: #e8ddd5; line-height: 1.2; white-space: nowrap;">
        Welcome to FocusSphere
      </h1>
    </header>

    <section class="card" style="text-align: center;">
      <div style="display: flex; justify-content: center; margin-bottom: 1rem;">
        <div class="logo-stack" style="transform: scale(1.3);">
          <span class="logo-pill p1"></span>
          <span class="logo-pill p2"></span>
          <span class="logo-pill p3"></span>
        </div>
      </div>

      <h2 style="margin-bottom: 0.5rem;">Sign In</h2>
      <p class="subtitle">Enter your name to start your study session.</p>

      <div style="display: flex; flex-direction: column; gap: 1rem; margin-top: 1.5rem;">
        <input type="text" id="username-input" placeholder="Your Name or Student ID..." style="text-align: center;">
        <button id="login-btn" style="width: 100%;">Enter Dashboard</button>
      </div>
    </section>
  </main>

  <script>
    // Simple login logic: save name and redirect to index.html
    const loginBtn = document.getElementById('login-btn');
    const usernameInput = document.getElementById('username-input');

    loginBtn.addEventListener('click', () => {
      const name = usernameInput.value.trim();
      if (name === '') {
        alert('Please enter your name to continue.');
        return;
      }
      // Save name to localStorage so index.html can use it if wanted
      localStorage.setItem('focusSphereUser', name);
      // Redirect to the main study dashboard
      window.location.href = 'index.html';
    });
  </script>

</body>
</html>
